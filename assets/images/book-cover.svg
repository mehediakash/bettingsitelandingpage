<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 640" width="100%" height="100%">
  <defs>
    <!-- Background & Shadow Filters -->
    <filter id="bookShadow" x="-20%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="12" dy="25" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
    <filter id="pageGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Hardcover Gradient: Deep Royal Purple & Indigo -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#3730a3"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#171438"/>
    </linearGradient>

    <!-- Spine 3D Shading Gradient -->
    <linearGradient id="spineShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Gold Foil Embellishment Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="softWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pages Thickness Layer -->
    <linearGradient id="pageStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Ground Ambient Drop Shadow -->
  <ellipse cx="255" cy="595" rx="190" ry="24" fill="#0f172a" opacity="0.18" filter="blur(14px)"/>

  <!-- The 3D Book Container -->
  <g filter="url(#bookShadow)">
    <!-- Book Pages Edge (Right Side Thickness) -->
    <path d="M 405 60 L 435 85 L 435 555 L 405 530 Z" fill="url(#pageStack)"/>
    <!-- Page Lines Texture -->
    <line x1="412" y1="67" x2="412" y2="536" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="420" y1="73" x2="420" y2="542" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="428" y1="79" x2="428" y2="548" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>

    <!-- Bottom Page Edge -->
    <path d="M 75 565 L 105 590 L 435 555 L 405 530 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>

    <!-- Front Book Cover -->
    <rect x="75" y="45" width="330" height="520" rx="8" fill="url(#coverGrad)"/>

    <!-- Spine Hinge Crease Effect -->
    <rect x="75" y="45" width="30" height="520" fill="url(#spineShade)"/>
    <line x1="105" y1="45" x2="105" y2="565" stroke="#000000" stroke-width="1.5" opacity="0.25"/>
    <line x1="106" y1="45" x2="106" y2="565" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

    <!-- Gold Geometric Frame Border on Cover -->
    <rect x="118" y="70" width="265" height="470" rx="4" fill="none" stroke="url(#goldFoil)" stroke-width="1.8" opacity="0.85"/>
    <rect x="124" y="76" width="253" height="458" rx="2" fill="none" stroke="url(#goldFoil)" stroke-width="0.75" stroke-dasharray="6,3" opacity="0.6"/>

    <!-- Ornamental Header Icon / Emblem -->
    <g transform="translate(250, 125)">
      <circle cx="0" cy="0" r="26" fill="rgba(254, 240, 138, 0.12)" stroke="url(#goldFoil)" stroke-width="1.5"/>
      <!-- Open Book / Wisdom Emblem -->
      <path d="M -12 -5 Q 0 -14 12 -5 L 12 10 Q 0 2 -12 10 Z" fill="none" stroke="url(#goldFoil)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#goldFoil)" stroke-width="1.8"/>
      <!-- Rays -->
      <circle cx="0" cy="-18" r="2" fill="#fef08a"/>
      <line x1="-16" y1="-16" x2="-12" y2="-12" stroke="url(#goldFoil)" stroke-width="1.2"/>
      <line x1="16" y1="-16" x2="12" y2="-12" stroke="url(#goldFoil)" stroke-width="1.2"/>
    </g>

    <!-- Category / Author Tag -->
    <text x="250" y="180" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#fde047" letter-spacing="3" text-anchor="middle">বেস্টসেলার গাইডবুক</text>

    <!-- Main Book Title on Cover -->
    <text x="250" y="240" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">সাফল্য ও</text>
    <text x="250" y="285" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#facc15" text-anchor="middle" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.4))">আত্মউন্নয়নের</text>
    <text x="250" y="330" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">গোপন সূত্রসমূহ</text>

    <!-- Decorative Gold Divider -->
    <path d="M 175 355 L 235 355 M 265 355 L 325 355" stroke="url(#goldFoil)" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="250 351 254 355 250 359 246 355" fill="url(#goldFoil)"/>

    <!-- Subtitle on Cover -->
    <text x="250" y="390" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#e0e7ff" text-anchor="middle">লক্ষ্য অর্জন ও আত্মবিশ্বাস বৃদ্ধির</text>
    <text x="250" y="412" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">বাস্তবধর্মী কার্যকরী ফর্মুলা</text>

    <!-- Author & Edition Footer Box -->
    <rect x="145" y="470" width="210" height="42" rx="6" fill="rgba(15, 23, 42, 0.45)" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1"/>
    <text x="250" y="496" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">বুকসপ বাংলা প্রিমিয়াম সংস্করণ</text>

    <!-- Silk Bookmark Ribbon Hanging from Top -->
    <path d="M 330 45 L 330 115 L 340 105 L 350 115 L 350 45 Z" fill="#ea580c" opacity="0.95" filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.3))"/>
  </g>
</svg>
