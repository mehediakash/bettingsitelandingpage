<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1422" />
    <meta
      name="description"
      content="Identity verification completed successfully."
    />
    <title>First Verified</title>
    <style>
      :root {
        --bg: #0d1422;
        --panel: rgba(28, 35, 49, 0.92);
        --panel-border: rgba(0, 196, 239, 0.42);
        --text: #f5f8ff;
        --muted: #c1cad8;
        --muted-link: #8996a9;
        --cyan: #09c6ed;
        --blue: #357bd6;
        --green: #00d311;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(34, 57, 83, 0.24),
            transparent 38%
          ),
          linear-gradient(145deg, #0c1320 0%, var(--bg) 52%, #111a29 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .verification-card {
        width: min(100%, 502px);
        padding: 42px 40px 39px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 23px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.3),
          0 0 28px rgba(0, 183, 229, 0.05);
        animation: card-enter 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .verified-heading {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        margin: 0;
        color: var(--cyan);
        font-size: clamp(1.75rem, 5vw, 2.18rem);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0.02em;
        text-shadow: 0 0 18px rgba(0, 197, 238, 0.42);
      }

      .checkmark {
        display: inline-grid;
        width: 39px;
        height: 39px;
        place-items: center;
        color: white;
        background: var(--green);
        border: 2px solid #031005;
        box-shadow: 0 0 14px rgba(0, 211, 17, 0.6);
        font-size: 29px;
        font-weight: 700;
        line-height: 1;
      }

      .message {
        max-width: 390px;
        margin: 22px auto 31px;
        color: var(--muted);
        font-size: clamp(0.98rem, 2.5vw, 1.08rem);
        line-height: 1.6;
      }

      .signup-button {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        width: 100%;
        color: #fff;
        background: linear-gradient(100deg, var(--cyan), var(--blue));
        border-radius: 11px;
        box-shadow: 0 12px 25px rgba(0, 181, 229, 0.28);
        font-size: 1.28rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          filter 180ms ease;
      }

      .signup-button:hover {
        filter: brightness(1.08);
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(0, 181, 229, 0.38);
      }
      .signup-button:active {
        transform: translateY(0);
      }
      .signup-button:focus-visible,
      .policy-link:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .policy-link {
        display: inline-block;
        margin-top: 28px;
        color: var(--muted-link);
        font-size: 0.85rem;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 180ms ease;
      }

      .policy-link:hover {
        color: #d5deeb;
      }

      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 18px;
        }
        .verification-card {
          padding: 34px 22px 31px;
          border-radius: 19px;
        }
        .verified-heading {
          gap: 10px;
        }
        .checkmark {
          width: 34px;
          height: 34px;
          font-size: 25px;
        }
        .message {
          margin-top: 19px;
          margin-bottom: 27px;
        }
        .signup-button {
          min-height: 55px;
          font-size: 1.12rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="verification-card" aria-labelledby="verified-title">
      <h1 class="verified-heading" id="verified-title">
        <span>FIRST VERIFIED</span>
        <span class="checkmark" aria-label="Verified">✓</span>
      </h1>
      <p class="message">
        Your identity has been securely verified. Click the button below to
        proceed to the registration page.
      </p>
      <a class="signup-button" href="https://gamebetx.live/register">SIGN UP</a>
      <a class="policy-link" href="#privacy">Privacy &amp; Terms Policy</a>
    </main>
  </body>
</html>
